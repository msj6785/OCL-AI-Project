<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OCL-AI | 뉴스 · 국내 주식</title>
  <meta name="description" content="NAVER 뉴스 검색 API를 이용한 실시간 뉴스 모니터" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=stocks-ui-2" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#top"><span class="brand-mark">O</span><span>OCL<span>-AI</span></span></a>

      <div class="sidebar-section">
        <div class="section-caption">
          <span>최근 본 뉴스</span>
          <button id="clearRecentNews" class="clear-recent-button" type="button" hidden>전체 삭제</button>
        </div>
        <div id="recentSearches" class="recent-searches">
          <span class="recent-empty">아직 본 뉴스가 없습니다.</span>
        </div>
      </div>
    </aside>

    <main class="main-content" id="top">
      <header class="topbar">
        <a class="mobile-brand" href="#top">OCL-AI</a>
        <nav class="section-switch" aria-label="서비스 메뉴">
          <a href="#top" id="showNews" aria-current="page">뉴스</a>
          <a href="#stockPanel" id="showStocks">국내 주식</a>
        </nav>
        <div class="breadcrumb" id="newsBreadcrumb"><strong id="breadcrumbCase"></strong></div>
      </header>

      <div class="content-wrap" id="newsPanel">
        <section class="page-intro">
          <div>
            <h1 id="pageTitle">뉴스 검색</h1>
            <p id="pageDescription">원하는 키워드를 입력해 NAVER 최신 뉴스를 조회합니다.</p>
            <form id="searchForm" class="search-form">
              <input id="searchInput" type="search" placeholder="예: Kubernetes, 인공지능, 삼성전자" autocomplete="off" aria-label="뉴스 검색어" />
              <button class="collect-button" type="submit">검색</button>
            </form>
          </div>
          <div class="intro-actions">
            <button class="collect-button" id="collectButton" type="button" disabled><span class="refresh-symbol">↻</span> 새로고침</button>
          </div>
        </section>

        <section class="summary-grid current-summary" aria-label="검색 요약">
          <article class="summary-card">
            <div class="summary-label">현재 표시 기사</div>
            <strong id="displayCount">-</strong>
            <span class="summary-note">한 번에 최대 10건 표시</span>
          </article>
          <article class="summary-card">
            <div class="summary-label">NAVER 검색 결과</div>
            <strong id="articleCount">-</strong>
            <span class="summary-note">검색 API가 반환한 전체 결과 수</span>
          </article>
          <article class="summary-card">
            <div class="summary-label">마지막 조회</div>
            <strong class="time-value" id="updateTime">--:--</strong>
            <span class="summary-note" id="updateDate">아직 조회하지 않음</span>
          </article>
        </section>

        <div class="section-bar">
          <div>
            <h2>최신 뉴스</h2>
            <span class="section-meta">NAVER 뉴스 검색 API에서 최신순으로 가져온 결과입니다.</span>
          </div>
        </div>

        <section class="timeline" id="timeline" aria-label="최신 뉴스 목록"></section>

        <nav class="pagination" id="pagination" aria-label="뉴스 페이지 이동" hidden>
          <button class="page-button" id="prevPage" type="button">← 이전</button>
          <span class="page-info" id="pageInfo">1 / 1</span>
          <button class="page-button" id="nextPage" type="button">다음 →</button>
        </nav>


      </div>
      <section class="content-wrap" id="stockPanel" aria-labelledby="stockTitle">
        <div class="page-intro">
          <div>
            <h1 id="stockTitle">국내 주식</h1>
            <p>관심 종목의 시세와 관련 뉴스를 확인하세요.</p>
          </div>
        </div>
        <form id="stockForm" class="stock-form">
          <label for="stockSymbol">종목</label>
          <select id="stockSymbol">
            <option value="005930">삼성전자 (005930)</option>
            <option value="000660">SK하이닉스 (000660)</option>
            <option value="035420">NAVER (035420)</option>
          </select>
          <button class="collect-button" type="submit">새로고침</button>
        </form>
        <p id="stockStatus" role="status"></p>
        <article class="summary-card" id="stockQuote" hidden>
          <div class="stock-card-head">
            <h2 id="stockName"></h2>
            <span id="stockCode" class="stock-code"></span>
          </div>
          <span class="summary-label">현재가</span>
          <strong id="stockPrice"></strong>
          <span id="stockChange" class="summary-note"></span>
          <span id="stockTime" class="summary-note"></span>
        </article>
        <article class="summary-card stock-chart" id="stockChart" hidden>
          <div class="stock-card-head">
            <h2>최근 30거래일 종가</h2>
            <span class="stock-code">토스증권</span>
          </div>
          <canvas id="stockCanvas" width="780" height="210" role="img"></canvas>
          <p class="summary-note" id="stockChartRange"></p>
        </article>
        <section class="stock-news" aria-labelledby="stockNewsTitle">
          <div class="stock-card-head">
            <h2 id="stockNewsTitle">종목 관련 뉴스</h2>
            <span class="stock-code">네이버 뉴스</span>
          </div>
          <p id="stockNewsStatus" role="status"></p>
          <ul id="stockNewsList"></ul>
        </section>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="script.js?v=stocks-ui-2"></script>
</body>
</html>
